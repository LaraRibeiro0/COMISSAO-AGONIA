<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Comissão Senhor da Agonia</title>
  <meta name="theme-color" content="#2b1d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Comissão">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Entrada -->
  <section id="login" hidden>
    <img src="logo.png" alt="Senhor D'Agonia – Comissão" class="login-logo">
    <form id="form-login" autocomplete="off">
      <label for="codigo">Código da comissão</label>
      <input id="codigo" name="codigo" type="password" required autocomplete="current-password">
      <button type="submit" class="btn primario">Entrar</button>
      <p id="login-erro" class="erro" hidden></p>
    </form>
  </section>

  <!-- Quem és? (primeira vez em cada aparelho) -->
  <section id="quem" hidden>
    <img src="logo.png" alt="Senhor D'Agonia – Comissão" class="login-logo quem-logo">
    <form id="form-quem" autocomplete="off">
      <h2>Quem está a usar este aparelho?</h2>
      <p class="dica">Só é perguntado uma vez. Serve para saber quem usa a app e quem faz cada alteração.</p>
      <select id="quem-lista"></select>
      <div id="quem-outro" hidden>
        <input id="quem-nome" type="text" placeholder="Nome e apelido" maxlength="60">
      </div>
      <button type="submit" class="btn primario">Continuar</button>
      <button type="button" id="quem-cancelar" class="btn" hidden>Cancelar</button>
    </form>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <header class="topo">
      <img src="icons/icon-192.png" alt="">
      <h1 id="titulo">Início</h1>
      <button id="btn-atualizar" class="atualizar" data-acao="atualizar" aria-label="Atualizar dados">↻</button>
    </header>
    <main id="conteudo"></main>
    <nav class="nav">
      <button data-vista="inicio"><span>🏠</span>Início</button>
      <button data-vista="calendario"><span>📅</span>Calendário</button>
      <button data-vista="festa"><span>🎉</span>Festa</button>
      <button data-vista="equipas"><span>👥</span>Equipas</button>
      <button data-vista="listas"><span>📋</span>Listas</button>
    </nav>
  </div>

  <!-- Janela (sheet) -->
  <div id="sheet-wrap" hidden>
    <div class="sheet-fundo" data-acao="fecharSheet"></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-topo">
        <h2 id="sheet-titulo"></h2>
        <button class="fechar" data-acao="fecharSheet" aria-label="Fechar">✕</button>
      </div>
      <div id="sheet-corpo"></div>
    </div>
  </div>

  <div id="toast" hidden></div>
  <div id="carregar"><div class="spinner"></div></div>

  <script type="module" src="app.js"></script>
</body>
</html>
